name: Custom Contribution Snake

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main

    paths:
      - "scripts/generate-snake.mjs"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate custom snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: iSousadev
        run: node scripts/generate-snake.mjs

      - name: Publish SVG
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/snake-output

          cp dist/github-contribution-snake-custom.svg /tmp/snake-output/

          git fetch origin output:output || true

          if git show-ref --verify --quiet refs/heads/output; then

            git switch output

          else

            git switch --orphan output
            git rm -rf . || true

          fi

          cp /tmp/snake-output/github-contribution-snake-custom.svg .

          git add github-contribution-snake-custom.svg

          if git diff --cached --quiet; then

            echo "Snake já está atualizada."
            exit 0

          fi

          git commit -m "chore: update custom contribution snake"

          git push origin output --force
